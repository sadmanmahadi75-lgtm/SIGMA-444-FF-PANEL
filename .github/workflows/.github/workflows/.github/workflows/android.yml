name: Build SIGMA 444 FF Panel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 17

      - name: Install MAUI Android
        run: dotnet workload install maui-android

      - name: Build APK
        run: dotnet publish SigmaFFPanel.csproj -f net8.0-android -c Release -p:AndroidPackageFormat=apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SIGMA-444-APK
          path: bin/Release/net8.0-android/**/*.apk
